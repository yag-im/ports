descr:
  distro:
    files:
      - AG Dress Designer.iso
    format: 1CD
    url: https://archive.org/download/ag-dress-designer/AG%20Dress%20Designer.iso
  igdb_slug: american-girl-dress-designer
  lang: en
  media_assets:
  name: 'The American Girls: Dress Designer'
  platform: win
  publisher: Mattel
  refs:
    ag_id:
    lutris_id: american-girl-dress-designer
    mg_id: 80423
    pcgw_id: The_American_Girls:_Dress_Designer
    qz_id:
  reqs:
    # readme.txt
    color_bits: 16
    screen_height: 480
    screen_width: 640
  runner:
    name: dosbox-x
    ver: 2025.12.01
  uuid: 01a06a16-5c46-779e-84d9-22075ac2094f
  year_released: 1999
  tags:
    - kids
    - edutainment
installer:
  tasks:
    - copy_src_cd_images:
    - dosbox:
        flavor: WIN98SE
        app_drive_size: 50 # uses 40MB
        tasks:
          - mount:
              letter: '{FIRST_CD_DRIVE_LETTER}'
              src: '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}'
          - run:
              path: '{FIRST_CD_DRIVE}\SETUP.EXE' # QT4
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\dress designer.exe'
# TODO: very slow (slide show) in dosbox-x win9x, but it's the best we can do :(
# qemu - choppy sound in win9x and winxp
# has some bug in all NTs requiring repack patch
# hangs in bottom menu click in wine even with repack
# qemu:winxp repack version - white screen, but sound is ok :)
