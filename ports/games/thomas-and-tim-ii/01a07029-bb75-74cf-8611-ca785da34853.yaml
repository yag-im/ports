descr:
  distro:
    files:
      - T2_SW.iso
    format: 1CD
    url: https://archive.org/download/t-2-sw/T2_SW.iso
  igdb_slug: thomas-and-tim-ii
  lang: sv
  media_assets:
    cover:
      image_id: 01a07029-bb75-74cf-8611-ca785da34853
    screenshots: []
  name: Thomas & Tim II
  platform: win
  publisher: DR Multimedie
  refs:
    ag_id:
    lutris_id:
    mg_id:
    pcgw_id:
    qz_id:
  reqs:
    color_bits: 16
    screen_height: 600
    screen_width: 800
  runner:
    name: qemu
    ver: latest
  uuid: 01a07029-bb75-74cf-8611-ca785da34853
  year_released: 1999
  tags:
    - kids
installer:
  tasks:
    - copy_src_cd_images:
    - qemu:
        flavor: WIN98SE # installer requirement is Win9x
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              path: '{FIRST_CD_DRIVE}\setup.exe' # select "Standard" install, game glitches with "Kompact"
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\T2.exe'
# Note: as per readme, this can be an Audio CD. But redumps' cue says it's not
