descr:
  distro:
    files:
      - Discworld Noir (Europe) (En,Es,It) (Disc 1) (Rerelease) (2003-02-03).bin
      - Discworld Noir (Europe) (En,Es,It) (Disc 2).bin # redumps' CD serial corresponds to (Rerelease) (2003-02-03)
      - Discworld Noir (Europe) (En,Es,It) (Disc 3) (Rerelease) (2003-02-03).bin
    format: 3CD
    url: Discworld Noir (Europe) (En,Es,It) (Disc 1) (Rerelease) (2003-02-03).zip # redump
    # Discworld Noir (Europe) (En,Es,It) (Disc 2).zip
    # Discworld Noir (Europe) (En,Es,It) (Disc 3) (Rerelease) (2003-02-03).zip
    # no SafeDisc in rerelease
  igdb_slug: discworld-noir
  lang: multi # En, Es, It
  media_assets:
  name: Discworld Noir
  platform: win
  publisher: GT Interactive Software
  refs:
    ag_id: discworld-noir
    lutris_id: discworld-noir
    mg_id: 1411
    pcgw_id: Discworld_Noir
    qz_id: 64
  reqs:
    color_bits: 24
    screen_height: 480
    screen_width: 640
  runner:
    name: qemu
    ver: '11.1.3'
  uuid: 01a03c14-01ba-72a2-bcf1-c238b702e3ca
  year_released: 2003
  tags:
installer:
  tasks:
    - copy_src_cd_images:
    - qemu:
        flavor: WINXPSP3
        tasks:
          - mount:
              letter: '{FIRST_CD_DRIVE_LETTER}'
              src:
                - '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{SECOND_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{THIRD_CD_DRIVE_LETTER}'
          - run:
              path: '{FIRST_CD_DRIVE}\SETUP.EXE'
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\TIN3_DXD.EXE'

# FYI: for the original (no re-release) redump version (1999):
