descr:
  distro:
    files:
      - Muppet Treasure Island Windows CD-ROM DISC1.iso
      - Muppet Treasure Island Windows CD-ROM DISC2.iso
      - Muppet Treasure Island Windows CD-ROM DISC3.iso
    format: 3CD
    url: https://archive.org/details/muppet-treasure-island-windows-cd-rom-disc-1
  igdb_slug: muppet-treasure-island
  lang: en
  media_assets:
  name: Muppet Treasure Island
  platform: win
  publisher: Activision
  refs:
    ag_id: 16556
    lutris_id: muppet-treasure-island
    mg_id: 6477
    pcgw_id: Muppet_Treasure_Island
    qz_id: 843
  reqs:
    color_bits: 8 # readme
    screen_height: 480
    screen_width: 640
  runner:
    name: dosbox-x
    ver: 2025.12.01
  uuid: 019377de-5218-7352-88ac-ef767d7b3bb6
  year_released: 1996
installer:
  tasks:
    - copy_src_cd_images:
    - dosbox:
        flavor: WIN311
        tasks:
          - mount:
              letter: '{FIRST_CD_DRIVE_LETTER}'
              src:
                - '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{SECOND_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{THIRD_CD_DRIVE_LETTER}'
          - run:
              path: '{FIRST_CD_DRIVE}\INSTALL.EXE'
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\MTI\TREASURE.EXE'

