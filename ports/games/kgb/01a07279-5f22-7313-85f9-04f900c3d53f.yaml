descr:
  distro:
    files:
      - disk1.img
      - disk2.img
      - disk3.img
    format: 3FD
    url: https://archive.org/details/001536-Kgb
  igdb_slug: kgb
  lang: en
  media_assets:
  name: KGB
  platform: dos
  publisher: Virgin Entertainment
  refs:
    ag_id: kgb
    lutris_id: kgb
    mg_id: 2894
    pcgw_id: Conspiracy_-_KGB
    qz_id: 129
  reqs:
    color_bits: 8
    screen_height: 480
    screen_width: 640
  runner:
    name: dosbox-x
    ver: 2025.12.01
  uuid: 01a07279-5f22-7313-85f9-04f900c3d53f
  year_released: 1992
  tags:
installer:
  tasks:
    - file:
        path: '{DEST_DIR}/{FIRST_FD_DRIVE_LETTER}'
        state: directory
    - copy:
        src: '{item}'
        dest: '{DEST_DIR}/{FIRST_FD_DRIVE_LETTER}'
        loop:
          - '{SRC_DIR}/{descr[distro][files][0]}'
          - '{SRC_DIR}/{descr[distro][files][1]}'
          - '{SRC_DIR}/{descr[distro][files][2]}'
    - dosbox:
        conf:
          fullscreen: true
        tasks:
          - mount:
              letter: '{FIRST_FD_DRIVE_LETTER}'
              src:
                - '{DEST_DIR}/{FIRST_FD_DRIVE_LETTER}/{descr[distro][files][0]}'
                - '{DEST_DIR}/{FIRST_FD_DRIVE_LETTER}/{descr[distro][files][1]}'
                - '{DEST_DIR}/{FIRST_FD_DRIVE_LETTER}/{descr[distro][files][2]}'
              type: floppy
          - run:
              path: '{FIRST_FD_DRIVE}\INSTALL.EXE' # hit Ctrl+F4 multiple times when requested
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\kgbprg'
              args:
                - ENG
                - VGA
                - SDB2227
                - '386'
          - umount:
              letter: '{FIRST_FD_DRIVE_LETTER}'
