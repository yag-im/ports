descr:
  distro:
    files:
      - MYST.bin
    format: 1CD
    url: https://archive.org/details/myst-classic-redump-46659
  igdb_slug: myst
  is_visible: false
  lang: en
  media_assets:
  name: Myst
  platform: win
  publisher: Cyan Worlds
  refs:
    ag_id: 15732
    lutris_id: myst
    mg_id: 1223
    pcgw_id: Myst
    qz_id: 1345
  reqs:
    color_bits: 8
    screen_height: 480
    screen_width: 640
  runner:
    name: dosbox-x
    ver: 2024.12.04
  ts_added: 2024-10-01 09:30:22 America/Los_Angeles
  uuid: 36a2634b-b1df-4a2e-bc82-35f307673777
  year_released: 1994
installer:
  tasks:
    - copy_src_cd_images:
    - dosbox:
        flavor: WIN311
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              # proceed with a minimal CD installation
              path: '{FIRST_CD_DRIVE}\MSSETUP.EXE'
          - gen_run_script:
              path: '{APP_DIR}\MYST.EXE'
    # resolve QT conflict
    - shell:
        cmd: >-
          python3 -c "import configparser, sys;
          p = sys.argv[1];
          c = configparser.ConfigParser();
          c.read(p);
          c['Override'] = dict(oldVersion='1');
          c.write(open(p, 'w', newline='\r\n', encoding='UTF-8'), space_around_delimiters=False)"
          '{DEST_DIR}/{SYSTEM_DRIVE_LETTER}/WINDOWS/QTW.INI'
