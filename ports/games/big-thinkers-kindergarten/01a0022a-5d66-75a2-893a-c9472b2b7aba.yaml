installer:
  tasks:
    - copy_src_cd_images:
    - dosbox:
        flavor: WIN311
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              path: '{FIRST_CD_DRIVE}\INSTALL.EXE'
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\THINKERK.EXE'
              exit: false
    - copy:
        src: '{PORT_FILES_DIR}/{item}'
        dest: '{DEST_DIR}/C/WINDOWS'
        loop:
          - 'HEGAMES.INI' # to skip CD test and reg window at startup
