descr:
  distro:
    files:
      - disk1.img
      - disk2.img
      - disk3.img
      - disk4.img
      - disk5.img
      - disk6.img
      - disk7.img
      - disk8.img
      - disk9.img
      - disk10.img
    format: 10FD
    url: https://archive.org/details/000299-MartianMemorandum
  igdb_slug: tex-murphy-martian-memorandum
  lang: en
  media_assets:
  name: 'Tex Murphy: Martian Memorandum'
  platform: dos
  publisher: Access Software
  refs:
    ag_id: tex-murphy-martian-memorandum
    lutris_id: tex-murphy-martian-memorandum
    mg_id: 222
    pcgw_id: Tex_Murphy:_Martian_Memorandum
    qz_id:
  reqs:
    color_bits: 8
