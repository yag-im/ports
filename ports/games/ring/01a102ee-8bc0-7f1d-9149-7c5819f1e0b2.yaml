installer:
  tasks:
    - copy_src_cd_images:
    - dosbox:
        app_drive_size: 350 # 290 is required
        flavor: WIN98SE # glitches in WIN95OSR25
        tasks:
          - mount:
              letter: '{FIRST_CD_DRIVE_LETTER}'
              src:
                - '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{SECOND_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{THIRD_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{FOURTH_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{FIFTH_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{SIXTH_CD_DRIVE_LETTER}'
          - run:
              #path: '{FIRST_CD_DRIVE}\SETUP.EXE' # DX 6
              # TODO: Ctrl+F4 till disk 6 to run setup
              path: explorer
              exit: false
          - gen_run_script:
              #path: '{APP_DIR}\RING.EXE'
              path: explorer.exe # TODO: ring.exe won't start without explorer. Put a shortcut into Startup
              exit: false
