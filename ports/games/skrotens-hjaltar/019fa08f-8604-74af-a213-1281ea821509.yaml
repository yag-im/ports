installer:
  tasks:
    - copy_src_cd_images:
    - qemu:
        flavor: WINXPSP3 # hangs on startup in WIN98SE
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              path: '{FIRST_CD_DRIVE}\setup\SETUP.EXE'
          - move: # TODO: due to the autostartup characters in a path limitations
              src: '{APP_DIR}\Skrotens hjältar\*'
              dest: '{APP_DIR}'
          - move: # TODO: due to the autostartup characters in a path limitations
              src: '{APP_DIR}\Skrotens hjältar.exe'
              dest: '{APP_DIR}\Skrotens.exe'
          - gen_run_script:
              path: '{APP_DIR}\Skrotens.exe'

# https://archive.org/details/SKROTEN - broken release
