installer:
  tasks:
    - copy_src_cd_images:
    - dosbox:
        flavor: WIN95OSR25
        app_drive_size: 25 # requires 20
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              path: '{FIRST_CD_DRIVE}\Autorun.exe'
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\KIDKEYS.EXE'
