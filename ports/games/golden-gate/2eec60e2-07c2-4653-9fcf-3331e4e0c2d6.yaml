descr:
  distro:
    files:
      - Golden.Gate.eng.iso
    format: 1CD
    url: https://www.myabandonware.com/download/nkw-golden-gate
  igdb_slug: golden-gate
  lang: en
  name: Golden Gate
  platform: win
  publisher: Panasonic Interactive Media
  refs:
    ag_id: 15743
    lutris_id: null
    mg_id: 4960
    pcgw_id: null
    qz_id: null
  reqs:
    color_bits: 8
    screen_height: 480
    screen_width: 640
  runner:
    name: wine
    ver: "10.0"
  ts_added: 2024-05-23 03:52:00 America/Los_Angeles
  uuid: 2eec60e2-07c2-4653-9fcf-3331e4e0c2d6
  year_released: 1997
installer:
  tasks:
    - extract:
        src: '{SRC_DIR}/{descr[distro][files][0]}'
        dest: '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}'
        files:
          - NEWMLIST.TXT
          - GGVARS
          - GGSYSTBL
          - GOLDEN
          - QTIME32
    - file:
        path: '{DEST_APP_DIR}'
        state: directory
    # official patch with another manual patch on top of it (emulates fake HIGH video mode in wine,
    # avoiding a MessageBox popup on a startup)
    - copy:
        src: '{SRC_DIR}/patch/GOLDENGA.EXE-patch-mod'
        dest: '{DEST_APP_DIR}/GOLDENGA.EXE'
    - wine:
        os_ver: win95
        tasks:
          - mount:
              letter: '{FIRST_CD_DRIVE_LETTER}'
              src: '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}'
          # TODO: this hangs cos QT remains opened, so remove {DEST_DIR}/E/QTIME32 manually
          - run:
              path: '{FIRST_CD_DRIVE}\QTIME32\QT32INST.EXE'
              virtual_desktop: false
          - gen_run_script:
              path: '{APP_DIR}\GOLDENGA.EXE'
