  igdb_slug: my-amazing-human-body
  lang: en
  media_assets:
  name: My Amazing Human Body
  platform: win
  publisher: Dorling Kindersley
  refs:
    ag_id:
    lutris_id: my-amazing-human-body
    mg_id: 180332
    pcgw_id:
    qz_id:
  reqs:
    color_bits: 8
    screen_height: 480
    screen_width: 640
