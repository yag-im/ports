installer:
  tasks:
    - copy_src_cd_images:
    - dosbox:
        flavor: WIN95OSR25 # BSOD in qemu:WIN98SE; QT issue in qemu:WINXPSP3
        app_drive_size: 20 # uses 15MB
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              path: '{FIRST_CD_DRIVE}\SETUP.EXE' # QT2.1.2
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\MAHB.EXE'
