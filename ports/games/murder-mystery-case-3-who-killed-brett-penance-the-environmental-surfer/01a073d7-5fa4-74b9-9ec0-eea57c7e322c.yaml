installer:
  tasks:
    - dosbox:
        flavor: WIN311
        tasks:
          - gen_run_script:
              path: '{APP_DIR}\BRETTP.EXE'
    - extract:
        src: '{SRC_DIR}/{descr[distro][files][0]}'
        dest: '{DEST_APP_DIR}'
        files:
          - 'SUPPORT/*'
    # without QT 1.0 removal game tries to use it and fails to play any movie
    - file:
        path: '{item}'
        state: absent
        loop:
          - '{DEST_APP_DIR}/QT*'
          - '{DEST_APP_DIR}/PLAYER.EXE'
          - '{DEST_APP_DIR}/VIEWER.EXE'
          - '{DEST_APP_DIR}/QCMC.QTC'
