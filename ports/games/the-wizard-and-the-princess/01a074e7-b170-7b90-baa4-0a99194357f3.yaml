installer:
  tasks:
    - copy:
        src: '{SRC_DIR}/{descr[distro][files][0]}'
        dest: '{DEST_DIR}/{FIRST_FD_DRIVE_LETTER}'
    - dosbox:
        conf:
          machine: pcjr
        tasks:
          - mount:
              letter: '{FIRST_FD_DRIVE_LETTER}'
              src:
                - '{DEST_DIR}/{FIRST_FD_DRIVE_LETTER}'
              type: floppy
          - gen_run_script:
              pre_exec:
                - 'BOOT {FIRST_FD_DRIVE_LETTER}:'
# without mounting, boot using img file name: "A"
# with mounting, boot using drive name: "A:"
