installer:
  tasks:
    - extract:
        src: '{item}'
        dest: '{DEST_DIR}/{FIRST_FD_DRIVE_LETTER}'
        loop:
          - '{SRC_DIR}/{descr[distro][files][0]}'
    - dosbox:
        tasks:
          - mount:
              letter: '{FIRST_FD_DRIVE_LETTER}'
              src: '{DEST_DIR}/{FIRST_FD_DRIVE_LETTER}'
              type: floppy
          - run:
              path: '{FIRST_FD_DRIVE}\INSTALLH.BAT'
              args:
                - 'D:'
          - gen_run_script:
              path: '{APP_DRIVE}\SIERRA\KQ2\KQ2.COM'
              args:
                - '%1'
                - '%2'
                - '%3'
                - '%4'
                - '%5'
          - umount:
              letter: '{FIRST_FD_DRIVE_LETTER}'
