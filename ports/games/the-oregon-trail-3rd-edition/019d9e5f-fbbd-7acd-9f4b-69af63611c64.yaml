installer:
  tasks:
    - copy_src_cd_images:
    - qemu:
        # app_drive_size: 50 # uses 38MB
        flavor: WINXPSP3
        tasks:
          - mount:
              letter: '{FIRST_CD_DRIVE_LETTER}'
              src:
                - '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{SECOND_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{THIRD_CD_DRIVE_LETTER}'
          - run:
              path: '{FIRST_CD_DRIVE}\SETUP.EXE' # DX5
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\ot3.exe'
