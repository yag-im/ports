installer:
  tasks:
    - extract:
        src: '{SRC_DIR}'
        dest: '{DEST_DIR}'
        cd_images_as_letters: true
    - wine:
        os_ver: win95
        tasks:
          - mount:
              letter: '{FIRST_CD_DRIVE_LETTER}'
              src: '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}'
          - run:
              path: '{FIRST_CD_DRIVE}\SETUP.EXE' # QT4
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\scooby.exe'
# QEMU: fails to run on WINXPSP3 due to DX 7 compat issues, jumping mouse issues in WIN98SE
# dosbox-x: extra slow, sound glitches
