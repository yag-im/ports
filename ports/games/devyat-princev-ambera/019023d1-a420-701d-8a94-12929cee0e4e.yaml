  year_released: 1998
installer:
  tasks:
    - copy_src_cd_images:
    - dosbox:
        conf:
          sensitivity: 200
          # fixes right/down mouse movements stuck issue
          # The game adds INT 33h/0Bh mouse deltas to its own cursor and then forces the cursor to an even coordinate, so with fast polling a slow single +1 step (right/down) is rounded back while -1 (left/up) moves by 2.
          # sensitivity=200 makes DOSBox report every host pixel as a delta of 2, which the even-rounding never loses, so all four directions move the same.
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              path: '{FIRST_CD_DRIVE}\INSTALL.EXE'
          - gen_run_script:
              path: '{APP_DIR}\NPA.EXE'
