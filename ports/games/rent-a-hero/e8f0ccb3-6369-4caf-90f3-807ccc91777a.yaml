descr:
  distro:
    files:
      - RAHCD1.img
      - RAHCD2.img
    format: 2CD
    url: https://www.myabandonware.com/game/rent-a-hero-gff
  igdb_slug: rent-a-hero
  lang: en
  name: Rent-A-Hero
  platform: win
  publisher: THQ
  refs:
    ag_id: 15840
    lutris_id: null
    mg_id: 2424
    pcgw_id: Rent-a-Hero
    qz_id: 578
  reqs:
    color_bits: 8
    screen_height: 480
    screen_width: 640
  runner:
    name: dosbox-x
    ver: 2024.12.04
  ts_added: 2024-09-06 05:12:00 America/Los_Angeles
  uuid: e8f0ccb3-6369-4caf-90f3-807ccc91777a
  year_released: 1998
installer:
  tasks:
    - copy_src_cd_images:
    # merge "Game" folders from both CDs, they are copied into D:\Game below
    - extract:
        src: '{item}'
        dest: '{DEST_DIR}'
        files:
          - Game
        loop:
          - '{SRC_DIR}/{descr[distro][files][0]}'
          - '{SRC_DIR}/{descr[distro][files][1]}'
    - dosbox:
        flavor: WIN98SE
        app_drive_size: 1000
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - copy:
              src: '{DEST_DIR}/Game'
              dest: '{APP_DRIVE}'
          - run:
              path: '{FIRST_CD_DRIVE}\Setup\Setup.exe'
              exit: false
          - copy:
              src: '{PORT_FILES_DIR}/RAH.INI'
              dest: '{SYSTEM_DRIVE}\WINDOWS'
          - umount:
              cd_images_as_letters: true
          - gen_run_script:
              path: '{APP_DIR}\rent-a-hero.exe'
    - file:
        path: '{DEST_DIR}/Game'
        state: absent
