installer:
  tasks:
    - copy_src_cd_images:
    - dosbox:
        app_drive_size: 30 # uses 26
        flavor: WIN95OSR25
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              path: '{FIRST_CD_DRIVE}\SETUP.EXE'
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\dkcd.exe'
