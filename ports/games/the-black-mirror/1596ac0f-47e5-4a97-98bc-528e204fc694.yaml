descr:
  distro:
    files:
      - setup_the_black_mirror_2.0.0.2.exe
    format: gog
    url: https://www.gog.com/en/game/the_black_mirror
  igdb_slug: the-black-mirror
  lang: en
  name: The Black Mirror
  platform: win
  publisher: THQ Nordic
  refs:
    ag_id: 15584
    lutris_id: the-black-mirror
    mg_id: 9391
    pcgw_id: The_Black_Mirror
    qz_id: 1
  reqs:
    color_bits: 16
    screen_height: 600
    screen_width: 800
  runner:
    name: wine
    ver: '9.0'
  ts_added: 2024-05-16 02:49:00 America/Los_Angeles
  uuid: 1596ac0f-47e5-4a97-98bc-528e204fc694
  year_released: 2003
installer:
  tasks:
    - file:
        path: '{DEST_APP_DIR}'
        state: directory
    - innoextract:
        src: '{SRC_DIR}/{descr[distro][files][0]}'
        dest: '{DEST_APP_DIR}'
        files:
          - app/*
    - replace:
        path: '{DEST_APP_DIR}/agds.cfg'
        regexp: 'videomode=800x600x32'
        replace: 'videomode=800x600x16'
    - wine:
        virtual_desktop: 800x600
        tasks:
          - gen_run_script:
              path: '{APP_DIR}\BMirror.exe'
