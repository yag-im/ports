installer:
  tasks:
    - copy_src_cd_images:
    - qemu:
        flavor: WIN98SE
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          # - run:
          #     path: '{FIRST_CD_DRIVE}\SETUP.EXE'
          #     exit: false
          - run:
              path: 'explorer.exe' # add app shortcut to startup; without explorer game menu (top paper dropdown) doesn't work
              exit: false
          - gen_run_script:
              path: 'explorer.exe'
              exit: false
          # - gen_run_script:
          #     work_dir: '{FIRST_CD_DRIVE}'
          #     path: '{APP_DIR}\TIMMY1.EXE'
          #     args:
          #       - EMME
          #       - /CFG:D:\APP\timmy1.ini

