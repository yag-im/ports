              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              path: '{FIRST_CD_DRIVE}\SETUP.EXE'
              exit: false
          - gen_run_script:
              work_dir: '{FIRST_CD_DRIVE}'
              path: '{APP_DIR}\TIMMY1.EXE'
              args:
                - EMME
                - /CFG:D:\APP\timmy1.ini
