installer:
  tasks:
    - copy_src_cd_images:
    - dosbox:
        flavor: WIN98SE # java issues in dosbox:WIN95OSR25 and qemu:WINXPSP3
        app_drive_size: 2000
        tasks:
          - mount:
              letter: '{FIRST_CD_DRIVE_LETTER}'
              src:
                - '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}' # data cd2
                - '{DEST_DIR}/{SECOND_CD_DRIVE_LETTER}' # data cd1
                - '{DEST_DIR}/{THIRD_CD_DRIVE_LETTER}' # installation cd?
          - run:
              path: '{FIRST_CD_DRIVE}\setup.exe' # choose custom -> select all (1.8GB of data)
              exit: false
          - umount:
              letter: '{FIRST_CD_DRIVE_LETTER}'
          - gen_run_script:
              path: '{APP_DIR}\BCD2000.EXE'
