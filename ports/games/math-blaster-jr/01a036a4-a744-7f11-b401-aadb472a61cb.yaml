installer:
  tasks:
    - copy_src_cd_images:
    - dosbox:
        flavor: WIN311
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              path: '{FIRST_CD_DRIVE}\SETUP.EXE' # runs from CD, but without setup run there is no sound
              exit: false
          - gen_run_script:
              path: '{FIRST_CD_DRIVE}\MBJR.EXE'
              args:
                - MBJR.BAP
