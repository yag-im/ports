  tags:
installer:
  tasks:
    - copy_src_cd_images:
    - dosbox:
        flavor: WIN95OSR25
        app_drive_size: 50 # uses 44
        tasks:
          - mount:
              src:
                - '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{SECOND_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{THIRD_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{FOURTH_CD_DRIVE_LETTER}'
              letter: '{FIRST_CD_DRIVE_LETTER}'
          - run:
              path: '{FIRST_CD_DRIVE}\SETUP.EXE' # TODO: run LAPSE.EXE once to set 16 bit sound (find out where changes are stored)
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\TL.EXE'
