descr:
  distro:
    files:
      - TEENAGNT.bin
      - TEENAGNT.cue
    format: 1CD
    url: https://archive.org/details/nowy_teenagent
  igdb_slug: teenagent
  lang: pl
  name: Teenagent
  platform: dos
  publisher: Metropolis Software
  refs:
    ag_id: 24290
    lutris_id: teenagent
    mg_id: 6423
    pcgw_id: Teenagent
    qz_id: 556
  reqs:
    color_bits: 8
    screen_height: 400
    screen_width: 640
  runner:
    name: dosbox-x
    ver: 2024.12.04
  ts_added: 2024-08-25 00:51:00 America/Los_Angeles
  uuid: 3a0921b0-545e-42bd-9479-4f4329d1e8b3
  year_released: 1994
installer:
  tasks:
    # we need both BIN and CUE files for CD music to play
    - copy_src_cd_images:
    - dosbox:
        tasks:
          - mount:
              # CUE file should be mounted for CD music
              letter: '{FIRST_CD_DRIVE_LETTER}'
              src: '{DEST_DIR}/{descr[distro][files][1]}'
          - run:
              path: '{FIRST_CD_DRIVE}\INSTALUJ.EXE'
          - gen_run_script:
              path: '{APP_DIR}\TEENAGNT.EXE'
    - copy:
        src: '{PORT_FILES_DIR}/SOUND.SET'
        dest: '{DEST_APP_DIR}'
