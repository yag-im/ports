descr:
  distro:
    files:
      - faust-disc-1.iso
      - faust-disc-2.iso
      - faust-disc-3.iso
      - faust-disc-4.iso
    format: 4CD
    url: https://archive.org/details/faust-the-seven-games-of-the-soul
  igdb_slug: the-seven-games-of-the-soul
  lang: en
  name: The Seven Games of the Soul
  platform: win
  publisher: Cryo Interactive
  refs:
    ag_id: 15754
    lutris_id: null
    mg_id: 1393
    pcgw_id: Faust:_The_Seven_Games_of_the_Soul
    qz_id: 264
  reqs:
    color_bits: 24
    screen_height: 480
    screen_width: 640
  runner:
    name: wine
    ver: '9.0'
  ts_added: 2024-05-23 21:29:00 America/Los_Angeles
  uuid: ab2076b7-77bb-4d12-94ea-40ef163b76c4
  year_released: 2000
installer:
  tasks:
    - extract:
        src: '{SRC_DIR}/{descr[distro][files][0]}'
        dest: '{DEST_APP_DIR}'
        files:
          - DATA
          - ames.ini
          - aobj.ini
          - arxrin3.fon
          - Faust.exe
          - fl.ini
          - mmxImage.dll
    - move:
        src: '{DEST_APP_DIR}/DATA'
        dest: '{DEST_APP_DIR}/data'
    - copy:
        src: '{DEST_APP_DIR}/data/eng/sy.at3'
        dest: '{DEST_APP_DIR}/data'
    - extract:
        src: '{item}'
        dest: '{DEST_APP_DIR}'
        loop:
          - '{SRC_DIR}/{descr[distro][files][1]}'
          - '{SRC_DIR}/{descr[distro][files][2]}'
          - '{SRC_DIR}/{descr[distro][files][3]}'
    - copy:
        src: '{PORT_FILES_DIR}/cd.ini'
        dest: '{DEST_APP_DIR}/data'
    - replace:
        path: '{DEST_APP_DIR}/fl.ini'
        regexp: 'CDROM'
        replace: '.\\'
    - replace:
        path: '{DEST_APP_DIR}/fl.ini'
        regexp: 'CHECKCD:\s+1'
        replace: 'CHECKCD: 0'
    - replace:
        path: '{DEST_APP_DIR}/fl.ini'
        regexp: 'CHECKLOADSAVE:\s+1'
        replace: 'CHECKLOADSAVE: 0'
    - wine:
        tasks:
          - gen_run_script:
              path: '{APP_DIR}\Faust.exe'
