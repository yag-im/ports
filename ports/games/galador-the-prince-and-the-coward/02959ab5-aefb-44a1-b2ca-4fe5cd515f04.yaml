descr:
  distro:
    files:
      - Galador - Polish.iso
    format: 1CD
    url: https://www.old-games.ru/game/download/1942.html
  igdb_slug: galador-the-prince-and-the-coward
  lang: pl
  name: Książę i Tchórz
  platform: win
  publisher: Metropolis Software
  refs:
    ag_id: 45762
    lutris_id: galador-the-prince-and-the-coward
    mg_id: 30716
    pcgw_id: Galador:_The_Prince_and_the_Coward
    qz_id: 555
