installer:
  tasks:
    - copy_src_cd_images:
    - qemu:
        flavor: WINXPSP3
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              path: '{FIRST_CD_DRIVE}\INSTALL.EXE'
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\TKKG_6\TKKG6_16.EXE' # somehow in WINXP it's 16, in Win9x it's TKKG6_32.EXE
