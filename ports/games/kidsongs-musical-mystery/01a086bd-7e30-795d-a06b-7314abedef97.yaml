        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              #path: '{FIRST_CD_DRIVE}\SETUP.EXE'
              #path: 'explorer.exe' # bmp error on setup without explorer
              path: '{FIRST_CD_DRIVE}\DOSINST.BAT'
              exit: false
          - gen_run_script:
              #path: '{SYSTEM_DRIVE}\Program Files\TerraGlyph\Kidsongs - Musical Mystery\KidSongs.exe'
              path: '{APP_DIR}\KIDSONGS.EXE'
              exit: false
