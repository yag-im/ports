installer:
  tasks:
    - copy_src_cd_images:
    - qemu:
        flavor: WINXPSP3
        tasks:
          - mount:
              letter: '{FIRST_CD_DRIVE_LETTER}'
              src:
                - '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}'
                - '{DEST_DIR}/{SECOND_CD_DRIVE_LETTER}'
          - run:
              path: '{FIRST_CD_DRIVE}\Install.exe' # QT 4
              exit: false
          - gen_run_script:
              path: '{APP_DRIVE}\Mia2\Mia2.exe'
