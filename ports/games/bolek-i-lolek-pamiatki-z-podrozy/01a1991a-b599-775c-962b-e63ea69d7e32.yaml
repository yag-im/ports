installer:
  tasks:
    - copy_src_cd_images:
    - qemu:
        flavor: WIN98SE # install crashes in WINXP, game hangs in dosbox-x: win9x sometimes
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              path: '{FIRST_CD_DRIVE}\INSTALUJ.EXE' # select full install and "karta bez WaveTable", otherwise SYSTEM.INI will be corrupted by a new WaveTable section
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\BIL.EXE'
