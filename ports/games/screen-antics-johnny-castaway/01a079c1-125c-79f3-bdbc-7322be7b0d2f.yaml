installer:
  tasks:
    - copy:
        src: '{item}'
        dest: '{DEST_DIR}/{FIRST_FD_DRIVE_LETTER}'
        loop:
          - '{SRC_DIR}/{descr[distro][files][0]}'
    - dosbox:
        flavor: WIN311
        tasks:
          - mount:
              letter: '{FIRST_FD_DRIVE_LETTER}'
              src:
                - '{DEST_DIR}/{FIRST_FD_DRIVE_LETTER}'
              type: floppy
          - run:
              path: '{FIRST_FD_DRIVE}\SETUP.EXE'
              exit: false
          - gen_run_script:
              path: 'CONTROL.EXE'
              args:
                - DESKTOP
              exit: false
          - umount:
              letter: '{FIRST_FD_DRIVE_LETTER}'
