installer:
  tasks:
    - copy_src_cd_images:
    - qemu:
        flavor: WINXPSP3 # sound distortion in both WIN9X and XP on intro
        tasks:
          # install from the first CD, play from the second
          - mount:
              src: '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}'
              letter: '{FIRST_CD_DRIVE_LETTER}'
          - run:
              path: '{FIRST_CD_DRIVE}\setup.exe' # QT4
              exit: false
          - umount:
              letter: '{FIRST_CD_DRIVE_LETTER}'
          - mount:
              src: '{DEST_DIR}/{SECOND_CD_DRIVE_LETTER}'
              letter: '{FIRST_CD_DRIVE_LETTER}'
          - gen_run_script:
              path: '{APP_DRIVE}\bioscopia\bioscopia.exe'
