installer:
  tasks:
    - extract:
        src: '{SRC_DIR}/{descr[distro][files][0]}'
        dest: '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}'
        files:
          - sg/*
    - dosbox:
        flavor: WIN311
        tasks:
          - mount:
              letter: '{FIRST_CD_DRIVE_LETTER}'
              src:
                - '{DEST_DIR}/{FIRST_CD_DRIVE_LETTER}'
          - run:
              path: '{FIRST_CD_DRIVE}\SETUP.EXE'
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\SHADOW.EXE'
