installer:
  tasks:
    - copy_src_cd_images:
    - qemu:
        flavor: WINXPSP3
        #conf:
        #  safe_disc: '2.90' # redump version is DRM free
        tasks:
          - mount:
              src: '{DEST_DIR}'
              cd_images_as_letters: true
          - run:
              path: '{FIRST_CD_DRIVE}\setup.exe'
              exit: false
          - gen_run_script:
              path: '{APP_DIR}\Kalas med Rut och Knut.exe'
